# ---------------------------------------------------------------------------
# ARK Hygiene — catalogue admin (Decap CMS)
#
# Git-backed: every save is a commit to this repository, which triggers a
# Netlify rebuild. There is no database and no server to keep alive.
#
# Products are a FOLDER collection — one file per product — so the admin
# lists them as a searchable, sortable grid. A file collection with a list
# widget renders as a single blank card hiding a 74-row accordion, which is
# unusable at this size.
#
# Paths are relative to the REPOSITORY ROOT, not to redesign/.
# ---------------------------------------------------------------------------

backend:
  name: github
  repo: RYKAYzz/protective-gear-site
  # Must match the branch Netlify builds production from, otherwise edits
  # commit successfully but never reach the live site.
  branch: main
  commit_messages:
    create: "Add {{slug}} from admin"
    update: "Update {{slug}} from admin"
    delete: "Delete {{slug}} from admin"
    uploadMedia: "Upload {{path}} from admin"
    deleteMedia: "Delete {{path}} from admin"

# Uploaded images land in the canonical assets folder, which the build copies
# into the site (see the "sync-assets" script in redesign/package.json).
media_folder: assets/uploads
public_folder: /assets/uploads

logo_url: /favicon.svg

# The side-by-side preview only renders raw field dumps for this kind of
# data, which looks broken rather than helpful. The live site is the preview.
editor:
  preview: false

collections:
  # -------------------------------------------------------------------------
  # Products — one entry per product
  # -------------------------------------------------------------------------
  - name: products
    label: Products
    label_singular: Product
    folder: redesign/src/data/products
    extension: json
    format: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{name}}  ·  {{category}}"
    sortable_fields: [name, category, price, order]
    view_filters:
      - { label: "PPE & safety gear", field: category, pattern: ppe-safety-gear }
      - {
          label: "Sterilization & waste",
          field: category,
          pattern: sterilization-waste-equipment,
        }
      - { label: "Sanitary solutions", field: category, pattern: sanitary-solutions }
      - { label: "Spill management", field: category, pattern: spill-management }
      - {
          label: "Public health & sanitation",
          field: category,
          pattern: public-health-sanitation,
        }
      - { label: "Medical equipment", field: category, pattern: medical-equipment }
      - { label: "Has a price", field: price, pattern: "[0-9]" }
    fields:
      - name: name
        label: Product name
        widget: string
        hint: Shown on the card, e.g. "Examination gloves".

      - name: slug
        label: Slug
        widget: string
        pattern:
          [
            "^[a-z0-9]+(?:-[a-z0-9]+)*$",
            "Lowercase letters, numbers and hyphens only",
          ]
        hint: >-
          Unique id, lowercase with hyphens. Also becomes the filename, so
          avoid changing it once a product is live.

      - name: image
        label: Image
        widget: image
        media_library:
          config:
            max_file_size: 5000000
        hint: >-
          Click the field, then Upload. The Media library only lists images
          uploaded through here — the original product photos live in the
          category folders under assets/ and are already attached, so you do
          not need to re-pick them. Plain background, at least 800px wide.

      - name: description
        label: Description
        widget: text
        required: false
        hint: One or two lines, shown under the product name.

      - name: category
        label: Category
        widget: select
        options:
          - { label: "PPE & safety gear", value: "ppe-safety-gear" }
          - {
              label: "Sterilization & waste",
              value: "sterilization-waste-equipment",
            }
          - { label: "Sanitary solutions", value: "sanitary-solutions" }
          - { label: "Spill management", value: "spill-management" }
          - {
              label: "Public health & sanitation",
              value: "public-health-sanitation",
            }
          - { label: "Medical equipment", value: "medical-equipment" }

      - name: subcategory
        label: Sub-category
        widget: string
        required: false
        hint: >-
          Groups products within a category page, e.g. "hand-protection".
          Leave blank if not needed.

      - name: price
        label: Price — from (KSh)
        widget: number
        required: false
        value_type: int
        min: 0
        hint: >-
          Optional. Enter the lowest unit price, digits only, no commas.
          Leave blank and no price appears at all.

      - name: unit
        label: Price is per…
        widget: select
        required: false
        options:
          - { label: "— not set —", value: "" }
          - { label: "Piece", value: "piece" }
          - { label: "Pair", value: "pair" }
          - { label: "Box", value: "box" }
          - { label: "Pack", value: "pack" }
          - { label: "Carton", value: "carton" }
          - { label: "Roll", value: "roll" }
          - { label: "Set", value: "set" }
          - { label: "Litre", value: "litre" }
          - { label: "Unit", value: "unit" }
        hint: >-
          What the price buys. The customer sees "From KSh 2,500 per box".
          Leave unset and they just see "From KSh 2,500", which invites
          questions — set it wherever you know it.

      - name: order
        label: Sort position
        widget: number
        required: false
        value_type: int
        default: 999
        hint: >-
          Lower numbers appear first within a category. Leave at 999 for new
          products to place them last.

  # -------------------------------------------------------------------------
  # Categories — the six product groups, one file each so they list as a grid
  # -------------------------------------------------------------------------
  - name: categories
    label: Categories
    label_singular: Category
    folder: redesign/src/data/categories
    extension: json
    format: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - name: name
        label: Name
        widget: string
        hint: e.g. "PPE & safety gear".

      - name: slug
        label: Slug
        widget: string
        pattern:
          [
            "^[a-z0-9]+(?:-[a-z0-9]+)*$",
            "Lowercase letters, numbers and hyphens only",
          ]
        hint: >-
          Becomes the page address, e.g. /ppe-safety-gear, and links products
          to this category. Changing it breaks existing links and unlinks
          every product in it — avoid once live.

      - name: short
        label: Short description
        widget: text
        hint: Used on the homepage category grid.

      - name: intro
        label: Page intro
        widget: text
        hint: Used at the top of the category page.

      - name: order
        label: Sort position
        widget: number
        required: false
        value_type: int
        default: 99
        hint: Lower numbers appear first, in the menu and on the homepage.
