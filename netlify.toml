# ---------------------------------------------------------------------------
# Production now builds the Astro site in redesign/ and publishes
# redesign/dist. The legacy HTML at the repository root is no longer served;
# redesign/public/_redirects 301s every old .html URL to its new path,
# including /ppe-safety-gear.html (the live Google Ads landing page).
#
# To roll back: Netlify → Deploys → pick the last pre-cutover deploy →
# "Publish deploy". That restores the old site immediately.
# ---------------------------------------------------------------------------
[build]
  base = "redesign"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  base = "redesign"
  command = "npm run build"
  publish = "dist"

[context.branch-deploy]
  base = "redesign"
  command = "npm run build"
  publish = "dist"

# ---------------------------------------------------------------------------
# Caching. HTML stays uncached so content edits from /admin appear at once.
# Astro fingerprints everything in /_astro, so those files are immutable and
# can be cached hard — this is what makes repeat visits fast, which feeds
# Google Ads Quality Score and therefore cost per click.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
